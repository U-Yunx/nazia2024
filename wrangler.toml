# Cloudflare configuration for ANA24.
#
# This is a Workers static-assets config. The deploy step runs `wrangler deploy`,
# which requires either a Worker script entry-point (`main`) or an assets
# directory (`[assets]`). This app is a static SPA, so it ships the Vite build
# output as static assets — no Worker script is needed.
#
# NOTE: this file used to describe a Cloudflare *Pages* project
# (`pages_build_output_dir`). `wrangler deploy` rejects that shape with
# "Missing entry-point to Worker script or to assets directory" (after warning
# that a Pages project should use `wrangler pages deploy` instead), so the
# config now matches the command the deploy pipeline actually runs.
#
# Credentials are NOT stored here:
#   - CLOUDFLARE_API_TOKEN   -> a REAL secret; keep it in CI/environment secrets
#                               (needs the "Workers Scripts — Edit" permission)
#   - CLOUDFLARE_ACCOUNT_ID  -> public, but required when the token can reach
#                               more than one account
#   - VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY -> public build-time values,
#                               injected by `npm run deploy` (see
#                               scripts/check-deploy-env.mjs).

name = "ana24"
compatibility_date = "2024-11-01"

[assets]
# Upload the production build (vite build -> dist/).
directory = "./dist"

# Client-side routing: any path with no file on disk (e.g. /markets, /trading)
# returns index.html so React Router resolves it, instead of 404ing on a hard
# refresh or a deep link.
#
# ⚠️ DO NOT add a `/*  /index.html  200` rule to a `_redirects` file to do this.
# Cloudflare validates it as an infinite loop and rejects the whole upload:
#
#   Invalid _redirects configuration:
#   Line 7: Infinite loop detected in this rule. This would cause a redirect to
#   strip `.html` or `/index` and end up triggering this rule again. [code: 100324]
#
# The reason: a 200 rewrite to `/index.html` is normalised back to `/`, and then
# `/*` matches that path again — so the rule re-triggers itself. This setting is
# the supported way to serve an SPA fallback, so `not_found_handling` replaces
# the old `public/_redirects` file (which has been removed).
not_found_handling = "single-page-application"

# Uncomment to pin the account for a single-account deploy (the account ID is
# public, not a secret):
# account_id = "REPLACE_WITH_YOUR_ACCOUNT_ID"