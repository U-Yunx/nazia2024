# Cloudflare Pages project configuration for ANA24.
#
# This drives `wrangler pages deploy` (see package.json -> deploy:pages).
# The project name must match an existing Cloudflare Pages project in your
# account — `ana24` — otherwise the deploy fails with PROJECT_NOT_FOUND.
#
# Credentials are NOT stored here:
#   - CLOUDFLARE_API_TOKEN   -> set in CI/environment secrets (required)
#   - CLOUDFLARE_ACCOUNT_ID  -> set in CI/environment secrets (required),
#                               or uncomment `account_id` below and fill in.
#   - VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY -> public values, injected at
#                               build time by `npm run deploy` (see
#                               scripts/check-deploy-env.mjs).

name = "ana24"
pages_build_output_dir = "./dist"
compatibility_date = "2024-11-01"

# Cloudflare account that owns the Pages project. Prefer setting
# CLOUDFLARE_ACCOUNT_ID in the environment; uncomment only if you want it
# baked into this file (it is not a secret — it is your public account ID):
# account_id = "REPLACE_WITH_YOUR_ACCOUNT_ID"
