# Deploy ANA24 to Cloudflare Pages (GitHub Actions)
#
# IMPORTANT: Cloudflare Pages projects are deployed with the PAGES command:
#     wrangler pages deploy dist --project-name ana24
# NEVER use plain `wrangler deploy` — that is the Workers command and fails
# with "✘ [ERROR] Missing entry-point to Worker script or to assets directory".
#
# Repo secrets required:
#   CLOUDFLARE_API_TOKEN  (token with "Cloudflare Pages: Edit" permission)
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL     (publishable — inlined into the bundle at build time)
#   VITE_SUPABASE_ANON_KEY (publishable — inlined into the bundle at build time)
#
# Troubleshooting "the Deploy to Cloudflare Pages step failed":
#   * "Authentication error" / "code: 10000" → the API token is missing, expired,
#     or lacks the "Cloudflare Pages: Edit" permission.
#   * "Project not found" / "does not exist" → the Pages project `ana24` was
#     missing. The "Ensure Pages project exists" step below now creates it.
#   * The verify step below fails fast, by name, if a secret is empty.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing or empty repository secret(s): ${missing[*]}"
            echo ""
            echo "Add each one in GitHub → repo → Settings → Secrets and variables → Actions → New repository secret."
            echo "CLOUDFLARE_API_TOKEN must be a custom token with:"
            echo "  Account → Cloudflare Pages → Edit"
            echo "  Account → Account Settings → Read"
            exit 1
          fi
          echo "All four required secrets are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output="$(npx --yes wrangler@latest pages project create ana24 --production-branch main 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Created Cloudflare Pages project 'ana24'."
          elif echo "$output" | grep -qi "already exists"; then
            echo "Cloudflare Pages project 'ana24' already exists — continuing."
          else
            echo "::error::Could not create or find the Cloudflare Pages project 'ana24'. The wrangler output above says why (usually the API token lacks 'Cloudflare Pages: Edit', or CLOUDFLARE_ACCOUNT_ID belongs to a different account than the token)."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pages command — do NOT change this to `deploy` (Workers command).
          command: pages deploy dist --project-name=ana24